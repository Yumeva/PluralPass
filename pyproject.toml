[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pluralpass"
version = "1.0.0"
description = "Calibrated set-valued receiver prediction for partially observed football passing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Zhipeng Zhao" }]
keywords = [
  "football analytics",
  "conformal prediction",
  "uncertainty quantification",
  "graph transformer",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "PyYAML>=6.0",
  "requests>=2.31",
  "tqdm>=4.66",
  "torch>=2.3",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
pluralpass = "pluralpass.cli:main"

[project.urls]
Repository = "https://github.com/Yumeva/PluralPass"
Issues = "https://github.com/Yumeva/PluralPass/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
