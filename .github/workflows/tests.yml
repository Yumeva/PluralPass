name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile source
        run: python -m compileall -q src scripts figures tests
      - name: Lint source
        run: ruff check src scripts figures tests
      - name: Run tests
        run: pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
